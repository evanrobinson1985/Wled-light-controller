name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk WLED-Controller.apk
          cp wear/build/outputs/apk/release/wear-release.apk WLED-Watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WLED-Controller-apk
          path: WLED-Controller.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WLED-Watch-apk
          path: WLED-Watch.apk

      # Every pushed build becomes a release: the phone and watch apps check for these and
      # update themselves (the tag carries the build number they compare with their own).
      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            WLED-Controller.apk
            WLED-Watch.apk
